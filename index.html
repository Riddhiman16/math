<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Math Challenge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
    }
    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.30);
      backdrop-filter: blur(12px);
    }
    .tag {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      font-size: 13px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 10px; font-size: 30px; }
    .subtitle { color: #d1d5db; margin-bottom: 30px; }
    #problem {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(32px, 9vw, 58px);
      font-weight: 800;
      letter-spacing: 1px;
      margin: 20px 0 30px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: #1f2937;
      transition: transform .15s, opacity .15s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); opacity: .85; }
    .answer {
      margin-top: 22px;
      min-height: 28px;
      color: #c7d2fe;
      font-weight: 600;
    }
    .footer { margin-top: 28px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="tag">🧠 RANDOM MATH CHALLENGE</div>
    <h1>Solve This!</h1>
    <div class="subtitle">A new problem is generated every time you open or refresh this page.</div>

    <div id="problem">Loading...</div>

    <button id="newProblem">🎲 New Problem</button>
    <div class="answer" id="answer"></div>

    <div class="footer">Scan the QR code again for another challenge.</div>
  </main>

  <script>
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateProblem() {
      const operations = ["+", "-", "×", "÷"];
      const op = operations[randomInt(0, operations.length - 1)];
      let a, b, answer, text;

      if (op === "+") {
        a = randomInt(10, 999);
        b = randomInt(10, 999);
        answer = a + b;
        text = `${a} + ${b} = ?`;
      } else if (op === "-") {
        a = randomInt(10, 999);
        b = randomInt(10, a);
        answer = a - b;
        text = `${a} − ${b} = ?`;
      } else if (op === "×") {
        a = randomInt(2, 50);
        b = randomInt(2, 30);
        answer = a * b;
        text = `${a} × ${b} = ?`;
      } else {
        // Generate clean integer division problems.
        b = randomInt(2, 20);
        answer = randomInt(2, 50);
        a = b * answer;
        text = `${a} ÷ ${b} = ?`;
      }

      document.getElementById("problem").textContent = text;
      document.getElementById("answer").textContent = "";
      document.getElementById("problem").dataset.answer = answer;
    }

    document.getElementById("newProblem").addEventListener("click", generateProblem);

    // Optional: tap the problem itself to reveal the answer.
    document.getElementById("problem").addEventListener("click", () => {
      const answer = document.getElementById("problem").dataset.answer;
      document.getElementById("answer").textContent = `Answer: ${answer}`;
    });

    generateProblem();
  </script>
</body>
</html>
